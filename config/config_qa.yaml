subinfo_fields: [{name: subject_id, type: int, constraints: {min: 101, max: 999, digits: 3}}]
subinfo_mapping: {subject_id: Participant ID, Participant Information: Participant Information, registration_failed: Registration failed, registration_successful: Registration successful, invalid_input: "Invalid {field}"}
window: {size: [1280, 800], units: deg, screen: 0, bg_color: "#101216", fullscreen: false, monitor_width_cm: 35.5, monitor_distance_cm: 50}
task: {task_name: Automated Operation Span Task, save_path: ./outputs/qa, language: English, voice_enabled: false, total_blocks: 2, total_trials: 22, trial_per_block: 11, conditions: [math_practice, set_2_practice, set_3_scored, set_4_scored, set_5_scored, set_6_scored, set_7_scored], key_list: [space, f, h, j, k, l, n, p, q, r, s, t, y], seed_mode: same_across_sub, delta: 0.0, plan_seed: 69069, math_practice_count: 4, math_deadline: 0.4, phase_order: [instruction, solve, verification, letter, recall, feedback, good_bye]}
timing: {solve_window: 0.4, letter_duration: 0.1, recall_window: 0.4, feedback_duration: 0.1}
stimuli: {instruction: {type: text, font: Arial, text: "F false; J true; remember letters. Press SPACE.", color: white, height: 0.7}, operation: {type: text, font: Arial, text: "{expression} = ? Press SPACE", color: white, height: 1.0}, verification: {type: text, font: Arial, text: "{expression} = {proposed}   F FALSE / J TRUE", color: white, height: 0.8}, letter: {type: text, font: Arial, text: F, color: white, height: 2.0}, combined_intro: {type: text, font: Arial, text: "Deadline {deadline}. Press SPACE.", color: white, height: 0.7}, recall: {type: text, font: Arial, text: "{position}/{set_size} F H J K L N P Q R S T Y Chosen {chosen}", color: white, height: 0.7}, feedback: {type: text, font: Arial, text: "Letters {correct}/{total}; Math {math}/{math_total}", color: white, height: 0.8}, good_bye: {type: text, font: Arial, text: "Absolute {absolute}; Total {total}; Math {math}; {valid}. Press SPACE.", color: white, height: 0.7}}
triggers: {map: {experiment_start: 1, block_start: 10, operation: 20, verification: 30, false_response: 31, true_response: 32, letter: 40, recall: 50, letter_response: 51, feedback: 60, timeout: 70, block_end: 90, experiment_end: 99}, driver: {type: mock, print_codes: true}, policy: {strict: false}, timing: {post_delay_s: 0.001}}
qa: {output_dir: outputs/qa, enable_scaling: true, timing_scale: 0.05, min_frames: 1, strict: false, max_wait_s: 60.0, acceptance_criteria: {required_columns: [trial_id, phase, set_size, items, math_accuracy, recalled_letters, letters_correct, perfect_recall], triggers_required: true}}
responder: {type: responders.task_sampler:TaskSamplerResponder, kwargs: {accuracy: 0.9, rt_s: 0.01}}
