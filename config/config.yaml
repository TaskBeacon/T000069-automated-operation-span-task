subinfo_fields: [{name: subject_id, type: int, constraints: {min: 101, max: 999, digits: 3}}]
subinfo_mapping: {subject_id: Participant ID, Participant Information: Participant Information, registration_failed: Registration failed, registration_successful: Registration successful, invalid_input: "Invalid {field}"}
window: {size: [1280, 800], units: deg, screen: 0, bg_color: "#101216", fullscreen: false, monitor_width_cm: 35.5, monitor_distance_cm: 50}
task: {task_name: Automated Operation Span Task, save_path: ./outputs/human, language: English, voice_enabled: false, total_blocks: 3, total_trials: 33, trial_per_block: 11, conditions: [math_practice, set_2_practice, set_3_scored, set_4_scored, set_5_scored, set_6_scored, set_7_scored], key_list: [space, f, h, j, k, l, n, p, q, r, s, t, y], seed_mode: same_across_sub, delta: 0.0, plan_seed: 69069, math_practice_count: 15, math_deadline: 5.0, phase_order: [instruction, solve, verification, letter, recall, feedback, good_bye]}
timing: {solve_window: 10.0, letter_duration: 0.8, recall_window: 30.0, feedback_duration: 2.0}
stimuli:
  instruction: {type: text, font: Arial, text: "Solve each operation mentally, press SPACE when ready, then judge the proposed answer.\n\nF = FALSE     J = TRUE\n\nRemember each following letter in order. Keep math accuracy at or above 85%.\n\nPress SPACE to begin math practice.", color: white, height: 0.68, wrapWidth: 24, pos: [0, 0]}
  operation: {type: text, font: Arial, text: "{expression} = ?\n\nPress SPACE when solved", color: white, height: 1.0, pos: [0, 0]}
  verification: {type: text, font: Arial, text: "{expression} = {proposed}\n\nF = FALSE     J = TRUE", color: white, height: 0.9, pos: [0, 0]}
  letter: {type: text, font: Arial, text: F, color: white, height: 2.0, pos: [0, 0]}
  combined_intro: {type: text, font: Arial, text: "Math practice complete. Your verification deadline is {deadline} seconds.\n\nNow solve each operation and remember the following letter. Recall letters in order after each set.\n\nPress SPACE for combined practice.", color: white, height: 0.7, wrapWidth: 24, pos: [0, 0]}
  recall: {type: text, font: Arial, text: "Recall position {position} of {set_size}\n\nF   H   J   K   L   N\nP   Q   R   S   T   Y\n\nChosen: {chosen}\n\nPress the next letter key", color: white, height: 0.72, wrapWidth: 24, pos: [0, 0]}
  feedback: {type: text, font: Arial, text: "Letters correct: {correct}/{total}\nMath correct: {math}/{math_total}", color: white, height: 0.9, pos: [0, 0]}
  good_bye: {type: text, font: Arial, text: "Task complete\n\nAbsolute span: {absolute}/75\nTotal letters correct: {total}/75\nMath accuracy: {math}\nScore status: {valid}\n\nPress SPACE to exit.", color: white, height: 0.72, pos: [0, 0]}
triggers: {map: {experiment_start: 1, block_start: 10, operation: 20, verification: 30, false_response: 31, true_response: 32, letter: 40, recall: 50, letter_response: 51, feedback: 60, timeout: 70, block_end: 90, experiment_end: 99}, driver: {type: mock, print_codes: true}, policy: {strict: false}, timing: {post_delay_s: 0.001}}
